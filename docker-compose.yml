services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: otanime-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    networks:
      - otanime-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://otanime.webkulo.com/api
    container_name: otanime-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - otanime-network

networks:
  otanime-network:
    driver: bridge
